general {
  lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
  before_sleep_cmd = loginctl lock-session    # lock before suspend.
  after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
  timeout = 120
  on-timeout = notify-send "You are idle!"
  on-resume = notify-send "You can resume!"
}

listener {
  timeout = 300 # 5 min
  on-timeout = hyprlock # Locking the screen
}

listener {
  timeout = 420 # 7 min
  on-timeout = brightnessctl set 20%
  on-resume = brightnessctl -r
}

listener {
  timeout = 600 # 10 min
  on-timeout = hyprctl dispatch dpms off # turning off screen
  on-resume = hyprctl dispatch dpms on # turning on screen and restoring brightness
}
