source = ~/.config/hypr/macchiato.conf

background {
  monitor =
  path = ~/.config/hypr/wallpaper.png
  blur_passes = 2
}

# INPUT
input-field {
  monitor =
  size = 20%, 4%

  inner_color = rgba(200, 200, 200, 0.6)
  outline_thickness = 0
  check_color = $green
  fail_color = $red

  dots_size = 0.3
  font_color = $surface2
  fade_on_empty = false
  rounding = -1

  position = 0, -350
  halign = center
  valign = center
}

# TIME
label {
  text = $TIME
  position = 0, 320 
  font_size = 110
  font_family = Lilex Nerd Font Medium
  color = rgba(255, 255, 255, 0.7)
}

# DATE 
label {
  monitor = 
  text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
  color = rgba(255, 255, 255, 0.6)
  font_size = 15
  font_family = Lilex Nerd Font Medium
  position = 0, 220
  halign = center
  valign = center
}

label {
  monitor =
  text = Logged in as $DESC
  font_size = 13
  font_family = Lilex Nerd Font Medium
  position = 0, -300
}
