# Some default options
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g status-position top

# Renaming required variables
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Mouse support
set -g mouse on

# Sourcing the config file
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# Window navigation using shift-key
unbind n
bind-key -n S-Left previous-window
unbind p
bind-key -n S-Right next-window

# Window splitting
bind-key - split-window
bind-key | split-window -h

# Pane navigation using alt-key
unbind Left
bind -n M-h select-pane -L
unbind Down
bind -n M-j select-pane -D
unbind Up
bind -n M-k select-pane -U
unbind Right
bind -n M-l select-pane -R

# Numbering starting from 1
set-option -g base-index 1
set-option -g pane-base-index 1
bind n move-window -r


# Status bar options
set -g status-justify absolute-centre # Windows shown in left
set -g status-style bg=default # transparent status bar

# Session name
set -g status-left "#[fg="#a6da95"]"
set -ag status-left "#[fg="#24273a", bg="#a6da95"] "
set -ag status-left "#[bg="#1e2030", fg="#cad3f5"] #{session_name}"
set -ag status-left "#[fg="#1e2030", bg=default] "

set -g status-left-length 50
set -g status-right-length 200

# Window indicator
set -g window-status-format "#[fg=#8087a2,bg=default]#[fg="#1e2030", bg="#8087a2"]#I #[fg=#cad3f5, bg="#1e2030"] #W#[fg="#1e2030", bg=default]"
set -g window-status-current-format "#[fg=#8aadf4,bg=default]#[fg="#1e2030", bg="#8aadf4"]#I #[fg=#cad3f5, bg="#1e2030"] #W#[fg="#1e2030", bg=default]"

# Current working directory
set -g status-right "#[fg="#f4dbd6"]"
set -ag status-right "#[fg="#24273a", bg="#f4dbd6"]󰉋 "
set -ag status-right "#[bg="#1e2030", fg="#cad3f5"] #(echo #{b:pane_current_path} | sed 's#$HOME#~#g')"
set -ag status-right "#[fg="#1e2030", bg=default] "

# Application name
set -ag status-right "#[fg="#ed8796"]"
set -ag status-right "#[fg="#24273a", bg="#ed8796"]󰣆 "
set -ag status-right "#[bg="#1e2030", fg="#cad3f5"] #{pane_current_command}"
set -ag status-right "#[fg="#1e2030", bg=default] "

# Time
set -ag status-right "#[fg="#8aadf4"]"
set -ag status-right "#[fg="#24273a", bg="#8aadf4"] "
set -ag status-right "#[bg="#1e2030", fg="#cad3f5"] #(TZ="Asia/Kolkata" date +%%H:%%M)"
set -ag status-right "#[fg="#1e2030", bg=default] "
